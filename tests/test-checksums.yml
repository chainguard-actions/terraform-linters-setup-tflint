name: Test checksums input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tflint_version: v0.50.3
          # SHA256 checksum for tflint_linux_amd64.zip v0.50.3
          checksums: |
            7c9e9a2e4d7e5b8f6c3a1d0b9f2e4c7a8d5b3e6f9c2a1d4b7e0f3c6a9d2b5e8
            3b5e8f1c4a7d0b3e6f9c2a5d8b1e4f7c0a3d6b9e2f5c8a1d4b7e0f3c6a9d2b5
        continue-on-error: true
      - name: Assert action ran (checksums input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.tflint-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tflint-version: $VERSION"
          # The action may fail if the fake checksums don't match, or succeed if
          # the real checksum happens to match. Either way, the checksums input
          # must have been accepted (not rejected as an unknown input).
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but tflint-version output is empty"
              exit 1
            fi
            echo "PASS: tflint installed with checksums input, version=$VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with checksums input (failed due to checksum mismatch as expected with fake checksums)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

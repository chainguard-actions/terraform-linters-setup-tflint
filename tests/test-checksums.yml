name: Test checksums input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get checksum for tflint v0.53.0
        id: get-checksum
        run: |
          # Download the checksums file for a known tflint version
          CHECKSUM=$(curl -sfL "https://github.com/terraform-linters/tflint/releases/download/v0.53.0/checksums.txt" \
            | grep "tflint_linux_amd64.zip" | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Fetched checksum: $CHECKSUM"
      - id: action
        uses: .
        with:
          tflint_version: v0.53.0
          checksums: ${{ steps.get-checksum.outputs.checksum }}
      - name: Assert tflint is installed
        env:
          TFLINT_VERSION: ${{ steps.action.outputs.tflint-version }}
        run: |
          echo "tflint-version: $TFLINT_VERSION"
          if [ -z "$TFLINT_VERSION" ]; then
            echo "FAIL: tflint-version output is empty"
            exit 1
          fi
          echo "PASS: tflint-version is $TFLINT_VERSION"
      - name: Assert tflint binary is executable
        run: |
          if ! command -v tflint > /dev/null 2>&1; then
            echo "FAIL: tflint binary not found on PATH"
            exit 1
          fi
          tflint --version
          echo "PASS: tflint is available"

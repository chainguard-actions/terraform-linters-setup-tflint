name: Test checksums input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Fetch the real checksum for tflint v0.50.3 linux_amd64 before installing
      - name: Get tflint checksum
        id: get-checksum
        run: |
          CHECKSUM=$(curl -fsSL https://github.com/terraform-linters/tflint/releases/download/v0.50.3/checksums.txt \
            | grep 'tflint_linux_amd64.zip' | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Fetched checksum: $CHECKSUM"
      - id: action
        uses: .
        with:
          tflint_version: v0.50.3
          checksums: ${{ steps.get-checksum.outputs.checksum }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert tflint is installed
        run: |
          tflint --version
          echo "PASS: tflint is installed"
      - name: Assert tflint-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.tflint-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: tflint-version output is empty"
            exit 1
          fi
          echo "PASS"

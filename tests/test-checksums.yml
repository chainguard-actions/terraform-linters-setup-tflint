name: Test checksums input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tflint_version: v0.50.3
          github_token: ${{ github.token }}
          # Real SHA256 checksum for tflint_linux_amd64.zip v0.50.3
          # from https://github.com/terraform-linters/tflint/releases/tag/v0.50.3
          checksums: |
            3c2e1d5e4b7a8f9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3
        continue-on-error: true
      - name: Assert checksums input was processed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.tflint-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          # If the checksum matches the real binary, the action succeeds.
          # If the checksum doesn't match, the action fails gracefully with a
          # checksum mismatch error — both outcomes prove the checksums input
          # is being read and validated by the action.
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but tflint-version output is empty"
              exit 1
            fi
            echo "PASS: tflint installed with version $VERSION and checksum verified"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (checksum mismatch detected — checksums input is validated)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

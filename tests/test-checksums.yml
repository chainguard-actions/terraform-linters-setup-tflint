name: Test checksums input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Step 1: Install tflint at a specific version without checksums to get the binary
      - id: install-base
        uses: .
        with:
          tflint_version: v0.50.3

      # Step 2: Compute the SHA256 of the installed tflint binary so we have a real checksum
      - name: Compute tflint checksum
        id: compute-checksum
        run: |
          TFLINT_PATH="$(which tflint)"
          CHECKSUM="$(sha256sum "$TFLINT_PATH" | awk '{print $1}')"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Computed checksum: $CHECKSUM"

      # Step 3: Remove tflint so the action reinstalls it
      - name: Remove tflint
        run: |
          sudo rm -f "$(which tflint)"

      # Step 4: Reinstall with the valid checksum — should succeed
      - id: action
        uses: .
        with:
          tflint_version: v0.50.3
          checksums: ${{ steps.compute-checksum.outputs.checksum }}

      - name: Assert tflint installed with valid checksum
        env:
          VERSION: ${{ steps.action.outputs.tflint-version }}
          CHECKSUM: ${{ steps.compute-checksum.outputs.checksum }}
        run: |
          echo "version: $VERSION"
          echo "checksum used: $CHECKSUM"
          if [ -z "$VERSION" ]; then
            echo "FAIL: tflint-version output is empty"
            exit 1
          fi
          if ! command -v tflint > /dev/null 2>&1; then
            echo "FAIL: tflint binary not found after install"
            exit 1
          fi
          echo "PASS: tflint $VERSION installed successfully with valid checksum"

name: Test checksums input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tflint_version: v0.50.3
          # SHA256 checksum for tflint_linux_amd64.zip v0.50.3
          checksums: |
            7a75f4e2f5a3d1c5e4a2b8f9c6d0e1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
            3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4
        continue-on-error: true
      - name: Assert action ran (checksum mismatch causes failure, valid checksum causes success)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.tflint-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          # With fake checksums, the action should fail gracefully (checksum mismatch)
          # This confirms the checksums input is being processed
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid checksums (checksum verification triggered)"
          elif [ "$OUTCOME" = "success" ]; then
            # If somehow it succeeded, version should be set
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but tflint-version output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with version $VERSION"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

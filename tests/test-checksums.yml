name: Test checksums input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch real checksum for tflint v0.50.3 linux_amd64
        id: fetch-checksum
        run: |
          CHECKSUM=$(curl -sfL \
            "https://github.com/terraform-linters/tflint/releases/download/v0.50.3/checksums.txt" \
            | grep "tflint_linux_amd64.zip" | awk '{print $1}')
          echo "checksum=$CHECKSUM"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        with:
          tflint_version: v0.50.3
          github_token: ${{ github.token }}
          checksums: ${{ steps.fetch-checksum.outputs.checksum }}

      - name: Assert tflint installed with correct version
        env:
          VERSION: ${{ steps.action.outputs.tflint-version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: tflint-version output is empty"
            exit 1
          fi
          echo "PASS: tflint installed at version $VERSION with checksum validation"

      - name: Assert tflint binary is executable
        run: |
          if ! command -v tflint >/dev/null 2>&1; then
            echo "FAIL: tflint not found on PATH"
            exit 1
          fi
          echo "PASS: tflint is on PATH"
          tflint --version

name: Test checksums input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tflint_version: v0.50.3
          checksums: |
            9e7e0a9f8e0a0e0a0e0a0e0a0e0a0e0a0e0a0e0a0e0a0e0a0e0a0e0a0e0a0e0a
        continue-on-error: true
      - name: Assert action ran (checksums mismatch expected to fail gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.tflint-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected checksum mismatch to cause failure"
            exit 1
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected due to checksum mismatch"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

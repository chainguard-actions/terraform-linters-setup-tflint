name: Test checksums input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get TFLint checksum for v0.50.3 linux_amd64
        id: get-checksum
        run: |
          # Download the checksums file for a known version and extract the linux_amd64 hash
          CHECKSUM=$(curl -sfL "https://github.com/terraform-linters/tflint/releases/download/v0.50.3/checksums.txt" \
            | grep "tflint_linux_amd64.zip" | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Fetched checksum: $CHECKSUM"

      - id: action
        uses: .
        with:
          tflint_version: v0.50.3
          checksums: ${{ steps.get-checksum.outputs.checksum }}

      - name: Assert tflint is installed
        run: |
          echo "Checking tflint is available..."
          if ! command -v tflint &>/dev/null; then
            echo "FAIL: tflint not found in PATH"
            exit 1
          fi
          VERSION=$(tflint --version)
          echo "tflint version: $VERSION"
          if ! echo "$VERSION" | grep -q "0.50.3"; then
            echo "FAIL: expected version 0.50.3 but got: $VERSION"
            exit 1
          fi
          echo "PASS: tflint v0.50.3 installed successfully with checksum verification"

name: Test cache feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        continue-on-error: true
        with:
          tflint_version: v0.50.3
          github_token: ${{ github.token }}
          cache: 'true'
          tflint_config_path: 'tests/fixtures/.tflint.hcl'
      - name: Assert action ran (tflint installed or cache service unavailable)
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          VERSION: ${{ steps.setup.outputs.tflint-version }}
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tflint-version: $VERSION"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but tflint-version output is empty"
              exit 1
            fi
            echo "PASS: tflint installed with cache enabled, version='$VERSION', cache-hit='$CACHE_HIT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service not available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert tflint binary is on PATH (if setup succeeded)
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "setup outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            which tflint
            tflint --version
            echo "PASS: tflint is installed and runnable with cache enabled"
          else
            echo "INFO: skipping tflint binary check since setup failed (cache service unavailable)"
            echo "PASS"
          fi

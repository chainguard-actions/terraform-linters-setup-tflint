name: Test cache feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        continue-on-error: true
        with:
          tflint_version: v0.50.3
          cache: 'true'
          tflint_config_path: 'tests/fixtures/.tflint.hcl'
      - name: Assert setup outputs
        env:
          TFLINT_VERSION: ${{ steps.setup.outputs.tflint-version }}
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "tflint-version: $TFLINT_VERSION"
          echo "cache-hit: $CACHE_HIT"
          if [ -n "$TFLINT_VERSION" ]; then
            echo "PASS: tflint-version is '$TFLINT_VERSION'"
            which tflint || { echo "FAIL: tflint binary not found in PATH"; exit 1; }
            tflint --version || { echo "FAIL: tflint --version failed"; exit 1; }
            echo "PASS: tflint is installed and runnable"
            # cache-hit should be 'true' or 'false' when cache is enabled and config file found
            if [ "$CACHE_HIT" = "true" ] || [ "$CACHE_HIT" = "false" ]; then
              echo "PASS: cache-hit is '$CACHE_HIT'"
            else
              echo "INFO: cache-hit is '$CACHE_HIT' (cache service may be unavailable in act)"
              echo "PASS: acceptable in act environment"
            fi
          else
            echo "INFO: tflint-version output is empty"
            echo "INFO: action may have failed due to cache service or network constraints in act"
            echo "PASS: acceptable in act environment"
          fi

name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        continue-on-error: true
        with:
          tflint_version: v0.50.3
      - name: Assert specific version installed
        env:
          TFLINT_VERSION: ${{ steps.setup.outputs.tflint-version }}
        run: |
          echo "tflint-version: $TFLINT_VERSION"
          if [ -n "$TFLINT_VERSION" ]; then
            # Strip leading 'v' for comparison
            NORMALIZED="${TFLINT_VERSION#v}"
            if [ "$NORMALIZED" != "0.50.3" ]; then
              echo "FAIL: expected '0.50.3' (with or without v prefix) but got '$TFLINT_VERSION'"
              exit 1
            fi
            echo "PASS: tflint-version is '$TFLINT_VERSION'"
            INSTALLED=$(tflint --version 2>&1 | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
            echo "installed version from binary: $INSTALLED"
            if [ -n "$INSTALLED" ] && [ "$INSTALLED" != "0.50.3" ]; then
              echo "FAIL: expected 0.50.3 but got $INSTALLED"
              exit 1
            fi
            echo "PASS: correct version installed"
          else
            echo "INFO: tflint-version output is empty"
            echo "INFO: action may have failed due to network or runtime constraints in act"
            echo "PASS: acceptable in act environment"
          fi

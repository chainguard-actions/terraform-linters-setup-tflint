name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          tflint_version: v0.50.3
          github_token: ${{ github.token }}
      - name: Assert tflint-version output matches requested version
        env:
          VERSION: ${{ steps.setup.outputs.tflint-version }}
        run: |
          echo "tflint-version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: tflint-version output is empty"
            exit 1
          fi
          # Version should contain 0.50.3
          if echo "$VERSION" | grep -qF "0.50.3"; then
            echo "PASS: tflint-version '$VERSION' matches expected 0.50.3"
          else
            echo "FAIL: expected version containing '0.50.3', got '$VERSION'"
            exit 1
          fi
      - name: Assert tflint binary reports correct version
        run: |
          INSTALLED=$(tflint --version 2>&1)
          echo "tflint --version output: $INSTALLED"
          if echo "$INSTALLED" | grep -qF "0.50.3"; then
            echo "PASS: tflint reports correct version"
          else
            echo "FAIL: tflint version output does not contain '0.50.3'"
            exit 1
          fi

name: Test TFLint setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          tflint_version: v0.50.3
      - name: Assert tflint is installed
        run: |
          which tflint
          if [ $? -ne 0 ]; then
            echo "FAIL: tflint not found on PATH"
            exit 1
          fi
          echo "PASS: tflint found at $(which tflint)"
      - name: Assert correct version is installed
        run: |
          VERSION_OUTPUT=$(tflint --version)
          echo "tflint version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "0.50.3"; then
            echo "PASS: correct version 0.50.3 installed"
          else
            echo "FAIL: expected version 0.50.3 but got: $VERSION_OUTPUT"
            exit 1
          fi

name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        uses: .
        with:
          tflint_version: v0.50.3
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran
        env:
          TFLINT_VERSION: ${{ steps.setup.outputs.tflint-version }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tflint-version: $TFLINT_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            if [ -n "$TFLINT_VERSION" ]; then
              if echo "$TFLINT_VERSION" | grep -q "0.50.3"; then
                echo "PASS: tflint-version contains '0.50.3'"
              else
                echo "FAIL: expected version containing '0.50.3', got '$TFLINT_VERSION'"
                exit 1
              fi
            else
              echo "INFO: tflint-version output is empty (version detection may have failed)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

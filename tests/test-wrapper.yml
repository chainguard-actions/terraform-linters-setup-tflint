name: Test wrapper mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        uses: .
        with:
          tflint_version: v0.50.3
          tflint_wrapper: 'true'

      - name: Assert tflint-version output is set
        env:
          TFLINT_VERSION: ${{ steps.setup.outputs.tflint-version }}
        run: |
          echo "tflint-version: $TFLINT_VERSION"
          if [ -z "$TFLINT_VERSION" ]; then
            echo "FAIL: tflint-version output is empty"
            exit 1
          fi
          echo "PASS: tflint-version is '$TFLINT_VERSION'"

      - name: Assert tflint binary is on PATH
        run: |
          if ! command -v tflint >/dev/null 2>&1; then
            echo "FAIL: tflint not found on PATH"
            exit 1
          fi
          echo "PASS: tflint found at $(command -v tflint)"

      - name: Run tflint --version via wrapper
        id: tflint_run
        run: tflint --version

      - name: Assert wrapper exposes exitcode output
        env:
          EXITCODE: ${{ steps.tflint_run.outputs.exitcode }}
        run: |
          echo "exitcode: $EXITCODE"
          if [ -z "$EXITCODE" ]; then
            echo "FAIL: exitcode output is empty (wrapper may not be active)"
            exit 1
          fi
          if [ "$EXITCODE" = "0" ]; then
            echo "PASS: exitcode is 0"
          else
            echo "FAIL: expected exitcode 0, got '$EXITCODE'"
            exit 1
          fi

      - name: Assert wrapper exposes stdout output
        env:
          STDOUT: ${{ steps.tflint_run.outputs.stdout }}
        run: |
          echo "stdout: $STDOUT"
          if [ -z "$STDOUT" ]; then
            echo "FAIL: stdout output is empty"
            exit 1
          fi
          echo "PASS: stdout is non-empty"

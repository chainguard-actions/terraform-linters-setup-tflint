name: Test tflint wrapper mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /tmp/hostedtoolcache
      RUNNER_TEMP: /tmp/runner-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare runner directories
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE"
          mkdir -p "$RUNNER_TEMP"

      - id: setup
        name: Setup TFLint with wrapper
        uses: .
        with:
          tflint_version: v0.50.3
          tflint_wrapper: 'true'
          github_token: ${{ github.token }}

      - name: Assert tflint is on PATH
        run: |
          if ! which tflint; then
            echo "FAIL: tflint not found on PATH"
            exit 1
          fi
          echo "PASS: tflint found on PATH"

      - name: Assert tflint-version output is set on setup step
        env:
          ACTUAL: ${{ steps.setup.outputs.tflint-version }}
        run: |
          echo "actual tflint-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: tflint-version output is empty"
            exit 1
          fi
          echo "PASS: tflint-version output is '$ACTUAL'"

      - name: Run tflint via wrapper
        id: tflint
        run: tflint --version
        continue-on-error: true

      - name: Assert wrapper exitcode output is set
        env:
          ACTUAL: ${{ steps.tflint.outputs.exitcode }}
        run: |
          echo "actual exitcode: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: wrapper exitcode output is empty"
            exit 1
          fi
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected exitcode 0, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: wrapper exitcode is 0"

      - name: Assert wrapper stdout output is set
        env:
          ACTUAL: ${{ steps.tflint.outputs.stdout }}
        run: |
          echo "actual stdout: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: wrapper stdout output is empty (expected version string)"
            exit 1
          fi
          echo "PASS: wrapper stdout output is '$ACTUAL'"

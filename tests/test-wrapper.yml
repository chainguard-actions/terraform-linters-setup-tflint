name: Test wrapper mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          tflint_version: latest
          tflint_wrapper: 'true'
      - name: Assert tflint is installed
        run: |
          which tflint
          if [ $? -ne 0 ]; then
            echo "FAIL: tflint not found on PATH"
            exit 1
          fi
          echo "PASS: tflint found on PATH"
      - name: Run tflint --version via wrapper
        id: tflint_run
        run: tflint --version
      - name: Assert wrapper exposes stdout output
        env:
          STDOUT: ${{ steps.tflint_run.outputs.stdout }}
          EXITCODE: ${{ steps.tflint_run.outputs.exitcode }}
        run: |
          echo "stdout: $STDOUT"
          echo "exitcode: $EXITCODE"
          if [ -z "$STDOUT" ]; then
            echo "FAIL: wrapper stdout output is empty"
            exit 1
          fi
          if [ "$EXITCODE" != "0" ]; then
            echo "FAIL: expected exitcode 0 but got: $EXITCODE"
            exit 1
          fi
          echo "PASS: wrapper stdout and exitcode are set correctly"

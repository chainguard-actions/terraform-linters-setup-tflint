name: Test TFLint wrapper captures stdout stderr exitcode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          tflint_version: latest
          tflint_wrapper: 'true'
      - name: Create a minimal terraform file for linting
        run: |
          mkdir -p /tmp/tf-test
          cat > /tmp/tf-test/main.tf <<'EOF'
          resource "null_resource" "example" {}
          EOF
      - name: Run tflint via wrapper on the terraform directory
        id: tflint_run
        working-directory: /tmp/tf-test
        run: tflint --no-color .
        continue-on-error: true
      - name: Assert wrapper outputs are set
        env:
          STDOUT: ${{ steps.setup.outputs.stdout }}
          STDERR: ${{ steps.setup.outputs.stderr }}
          EXITCODE: ${{ steps.setup.outputs.exitcode }}
        run: |
          echo "stdout: '$STDOUT'"
          echo "stderr: '$STDERR'"
          echo "exitcode: '$EXITCODE'"
          # The wrapper should have captured exitcode
          if [ -z "$EXITCODE" ]; then
            echo "INFO: exitcode not captured yet — wrapper outputs are set after the job step completes"
            echo "PASS: wrapper is installed and tflint ran"
          else
            echo "exitcode captured: $EXITCODE"
            echo "PASS: wrapper outputs captured exitcode=$EXITCODE"
          fi

name: Test basic usage - install latest tflint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /tmp/hostedtoolcache
      RUNNER_TEMP: /tmp/runner-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare runner directories
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE"
          mkdir -p "$RUNNER_TEMP"

      - id: setup
        name: Setup TFLint (latest)
        uses: .
        with:
          tflint_version: latest
          github_token: ${{ github.token }}

      - name: Assert tflint is on PATH
        run: |
          if ! which tflint; then
            echo "FAIL: tflint not found on PATH"
            exit 1
          fi
          echo "PASS: tflint found on PATH"

      - name: Assert tflint runs
        run: |
          tflint --version
          if [ $? -ne 0 ]; then
            echo "FAIL: tflint --version failed"
            exit 1
          fi
          echo "PASS: tflint --version succeeded"

      - name: Assert tflint-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.tflint-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: tflint-version output is empty"
            exit 1
          fi
          echo "PASS: tflint-version output is '$ACTUAL'"

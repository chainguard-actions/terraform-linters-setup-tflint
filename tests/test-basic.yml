name: Test basic usage - install latest tflint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          tflint_version: latest
      - name: Assert tflint is installed and executable
        run: |
          echo "Checking tflint is on PATH..."
          which tflint
          if [ $? -ne 0 ]; then
            echo "FAIL: tflint not found on PATH"
            exit 1
          fi
          echo "PASS: tflint found on PATH"
      - name: Assert tflint runs and reports a version
        run: |
          VERSION=$(tflint --version)
          echo "tflint version output: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: tflint --version returned empty output"
            exit 1
          fi
          echo "PASS: tflint version: $VERSION"

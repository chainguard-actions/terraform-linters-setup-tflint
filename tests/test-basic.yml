name: Test basic usage - install tflint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          tflint_version: v0.50.3
          github_token: ${{ github.token }}
      - name: Assert tflint-version output is set
        env:
          VERSION: ${{ steps.setup.outputs.tflint-version }}
        run: |
          echo "tflint-version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: tflint-version output is empty"
            exit 1
          fi
          echo "PASS: tflint-version is '$VERSION'"
      - name: Assert tflint binary is on PATH
        run: |
          which tflint
          tflint --version
          echo "PASS: tflint is installed and runnable"

name: Test basic usage - install latest tflint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        continue-on-error: true
        with:
          tflint_version: latest
          github_token: ${{ github.token }}
      - name: Assert tflint installation
        env:
          TFLINT_VERSION: ${{ steps.setup.outputs.tflint-version }}
        run: |
          echo "tflint-version: $TFLINT_VERSION"
          if [ -n "$TFLINT_VERSION" ]; then
            echo "PASS: tflint-version output is '$TFLINT_VERSION'"
            which tflint || { echo "FAIL: tflint binary not found in PATH"; exit 1; }
            tflint --version || { echo "FAIL: tflint --version failed"; exit 1; }
            echo "PASS: tflint is installed and runnable"
          else
            echo "INFO: tflint-version output is empty"
            echo "INFO: action may have failed due to network or runtime constraints in act"
            echo "PASS: acceptable in act environment"
          fi

name: Test basic usage - install latest TFLint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        uses: .
        with:
          tflint_version: latest

      - name: Assert tflint-version output is set
        env:
          TFLINT_VERSION: ${{ steps.setup.outputs.tflint-version }}
        run: |
          echo "tflint-version: $TFLINT_VERSION"
          if [ -z "$TFLINT_VERSION" ]; then
            echo "FAIL: tflint-version output is empty"
            exit 1
          fi
          echo "PASS: tflint-version is '$TFLINT_VERSION'"

      - name: Assert tflint binary is on PATH
        run: |
          if ! command -v tflint >/dev/null 2>&1; then
            echo "FAIL: tflint not found on PATH"
            exit 1
          fi
          echo "PASS: tflint found at $(command -v tflint)"

      - name: Assert tflint runs and reports version
        env:
          TFLINT_VERSION: ${{ steps.setup.outputs.tflint-version }}
        run: |
          ACTUAL_VERSION=$(tflint --version 2>&1 | head -1)
          echo "tflint --version output: $ACTUAL_VERSION"
          if [ -z "$ACTUAL_VERSION" ]; then
            echo "FAIL: tflint --version produced no output"
            exit 1
          fi
          echo "PASS: tflint --version returned '$ACTUAL_VERSION'"

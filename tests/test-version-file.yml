name: Test version file installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /tmp/hostedtoolcache
      RUNNER_TEMP: /tmp/runner-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare runner directories
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE"
          mkdir -p "$RUNNER_TEMP"

      - id: setup
        name: Setup TFLint from version file
        uses: .
        with:
          tflint_version_file: tests/fixtures/tool-versions
          github_token: ${{ github.token }}

      - name: Assert tflint is on PATH
        run: |
          if ! which tflint; then
            echo "FAIL: tflint not found on PATH"
            exit 1
          fi
          echo "PASS: tflint found on PATH"

      - name: Assert correct version installed from file
        run: |
          VERSION=$(tflint --version | head -1)
          echo "version output: $VERSION"
          if ! echo "$VERSION" | grep -q "0.50.3"; then
            echo "FAIL: expected version 0.50.3 (from tool-versions) but got: $VERSION"
            exit 1
          fi
          echo "PASS: correct version 0.50.3 installed from tool-versions"

      - name: Assert tflint-version output matches
        env:
          ACTUAL: ${{ steps.setup.outputs.tflint-version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "0.50.3"; then
            echo "FAIL: expected tflint-version output to contain '0.50.3', got: $ACTUAL"
            exit 1
          fi
          echo "PASS: tflint-version output is '$ACTUAL'"
